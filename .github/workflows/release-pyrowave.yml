---
name: Release PyroWave

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

concurrency:
  group: release-pyrowave-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Resolve version
        id: version
        env:
          SOURCE_TAG: ${{ github.ref_name }}
        run: |
          base_tag="${SOURCE_TAG%-pyrowave}"
          echo "release_tag=${base_tag#v}-pyrowave" >> "${GITHUB_OUTPUT}"

  build-appimage:
    name: Linux AppImage
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/build-appimage.yml
    with:
      ci_version: ${{ needs.version.outputs.release_tag }}
      enable_pyrowave: true

  release:
    name: Publish GitHub release
    needs:
      - version
      - build-appimage
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download AppImage
        uses: actions/download-artifact@v6
        with:
          name: Moonlight-LinuxAppImage-${{ needs.version.outputs.release_tag }}
          path: artifacts

      - name: Create checksum
        working-directory: artifacts
        run: sha256sum ./*.AppImage > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.release_tag }}
        run: |
          gh release create "${RELEASE_TAG}" artifacts/* \
            --target "${GITHUB_SHA}" \
            --title "${RELEASE_TAG}" \
            --generate-notes
